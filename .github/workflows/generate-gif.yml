name: Generate Terminal GIF

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

concurrency:
  group: terminal-gif

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install github-readme-terminal requests python-dotenv Pillow
      - name: Render the terminal
        run: python generate_with_stats.py
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-gif
          path: output.gif
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: terminal-gif
      - name: Publish the GIF if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update terminal GIF'
          git push origin HEAD:main
